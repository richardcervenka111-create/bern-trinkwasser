<script>
(function(){
const CLASSES={"yes": {"color": "#1fbf8f", "de": "Trinkwasser", "en": "Drinking water", "sk": "Pitná voda"}, "unknown": {"color": "#ffcc55", "de": "Trinkwasser unbekannt", "en": "Drinking water unknown", "sk": "Pitnosť neznáma"}, "no": {"color": "#ff6b6b", "de": "Kein Trinkwasser", "en": "Not drinking water", "sk": "Nie pitná voda"}}, I={"de": {"title": "Bern Trinkwasser", "sub": "Alle öffentlichen Brunnen der Stadt auf einer Karte.", "near": "Nächster Brunnen", "hint": "Tippe auf „Nächster Brunnen“ oder auf einen Punkt.", "n": "Brunnen", "foot": "Trinkbar = Tag drinking_water=yes. Gelb = unbekannt, im Zweifel Schild am Brunnen beachten. Kein Tracking, Standort bleibt im Gerät."}, "en": {"title": "Bern Drinking Water", "sub": "All public fountains of the city on one map.", "near": "Nearest fountain", "hint": "Tap “Nearest fountain” or a dot.", "n": "fountains", "foot": "Drinkable = tag drinking_water=yes. Yellow = unknown, check the sign on the fountain. No tracking, your location stays on the device."}, "sk": {"title": "Bern pitná voda", "sub": "Všetky verejné fontány mesta na jednej mape.", "near": "Najbližšia fontána", "hint": "Ťukni na „Najbližšia fontána“ alebo na bod.", "n": "fontán", "foot": "Pitná = tag drinking_water=yes. Žltá = neznáme, pri pochybnosti pozri tabuľku na fontáne. Žiadne sledovanie, poloha ostáva v zariadení."}}, BANNER=null, DEFAULT_OFF=["no", "unknown"];
const COMMON={de:{route:"Route",m:"m",away:"entfernt",nearest:"Nächster Punkt",noGeo:"Standort nicht verfügbar. Erlaube den Zugriff oder zoome selbst.",locating:"Suche Standort …",none:"In dieser Auswahl gibt es keinen Punkt. Filter einschalten.",n:"Punkte",stand:"Stand OSM",src:"Daten:",foot:"Kein Tracking, Standort bleibt im Gerät. Fehler? Direkt in OpenStreetMap korrigieren.",wheel:"rollstuhlgängig",bottle:"Flasche füllbar",noleaf:"Karte konnte nicht geladen werden.",air:"Luftlinie",walk:"zu Fuss",min:"Min.",calc:"Fussweg wird berechnet …",hide:"Route ausblenden",osmroute:"Route in OSM",routenote:"Der Fussweg wird über routing.openstreetmap.de (FOSSGIS, OSRM) berechnet, dabei werden nur Start und Ziel übertragen."},
 en:{route:"Route",m:"m",away:"away",nearest:"Nearest",noGeo:"Location unavailable. Allow access or zoom yourself.",locating:"Locating …",none:"No point in this selection. Switch a filter on.",n:"points",stand:"OSM as of",src:"Data:",foot:"No tracking, your location stays on the device. Wrong? Fix it in OpenStreetMap.",wheel:"wheelchair accessible",bottle:"bottle refill",noleaf:"The map could not be loaded.",air:"straight line",walk:"on foot",min:"min",calc:"Calculating walking route …",hide:"Hide route",osmroute:"Route in OSM",routenote:"The walking route is computed by routing.openstreetmap.de (FOSSGIS, OSRM); only start and destination are sent."},};
let lang=(navigator.language||"de").slice(0,2); if(!I[lang]||lang==="sk") lang="de";
const KEY="map-lang-bern-trinkwasser"; try{const s=localStorage.getItem(KEY); if(s&&I[s]&&s!=="sk") lang=s;}catch(e){}
const t=k=>(I[lang][k]!==undefined?I[lang][k]:COMMON[lang][k]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const hidden=new Set(DEFAULT_OFF); let me=null, meMarker=null, line=null;
const data=(window.FOUNTAINS||[]).map(p=>({id:p.id,ty:"node",lat:p.lat,lon:p.lon,c:p.d,f:[p.n,p.l].filter(Boolean),w:p.w,b:p.b}));
if(!window.L){ $("map").innerHTML='<p style="padding:16px;color:var(--muted)">'+esc(COMMON[lang].noleaf)+'</p>'; }
const map=window.L?L.map("map",{zoomControl:true}).setView([46.948,7.447],14):null;
if(map){ L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map); }
const layer=map?L.layerGroup().addTo(map):null;
const icon=c=>L.divIcon({className:"",html:`<div class="dot" style="background:${CLASSES[c].color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
function label(p){ const lines=[`<b>${esc(CLASSES[p.c][lang])}</b>`].concat(p.f.map(esc)); if(p.w==="yes") lines.push(t("wheel")); if(p.b==="yes") lines.push(t("bottle"));
  lines.push(`<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking" rel="noopener">${t("route")}</a> · <a href="https://www.openstreetmap.org/${p.ty}/${p.id}" rel="noopener">OSM</a>`); return lines.join("<br>"); }
const visible=p=>!hidden.has(p.c);
function draw(){ if(!layer) return; layer.clearLayers(); let n=0; data.forEach(p=>{ if(!visible(p)) return; n++; L.marker([p.lat,p.lon],{icon:icon(p.c)}).bindPopup(label(p)).addTo(layer); });
  $("meta").textContent=`${n} ${t("n")}, ${t("stand")} ${((window.POINTS_META||window.FOUNTAINS_META||{}).osm_base||"").slice(0,10)}`; }
function dist(a,b,c,d){const R=6371000,q=Math.PI/180,x=(c-a)*q,y=(d-b)*q,h=Math.sin(x/2)**2+Math.cos(a*q)*Math.cos(c*q)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
let routeSeq=0, routeCtl=null;
function fmtDist(m){ return m>=1000?(m/1000).toFixed(1).replace(".",lang==="de"?",":".")+" km":Math.round(m)+" "+t("m"); }
function nearest(){ if(!me||!map) return; let best=null,bd=1e12; data.forEach(p=>{ if(!visible(p)) return; const d=dist(me[0],me[1],p.lat,p.lon); if(d<bd){bd=d;best=p;} });
  const pan=$("panel"); if(!best){ pan.innerHTML=`<span>${esc(t("none"))}</span>`; K.shake(pan); return; }
  if(line) map.removeLayer(line); line=L.polyline([me,[best.lat,best.lon]],{color:"#2f7bff",dashArray:"6 6",weight:3}).addTo(map); map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:17});
  const osm=`https://www.openstreetmap.org/directions?engine=fossgis_osrm_foot&route=${me[0]}%2C${me[1]}%3B${best.lat}%2C${best.lon}`;
  pan.innerHTML=`<div class="res"><div class="dist calc" id="dist">${fmtDist(bd)}<small>${t("calc")}</small></div><div class="what"><b>${esc(CLASSES[best.c][lang])}</b><span>${best.f[0]?esc(best.f[0]):""}</span></div><div class="acts"><a class="k-btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${best.lat},${best.lon}&travelmode=walking" rel="noopener">${t("route")}</a><a class="k-btn" href="${osm}" rel="noopener">${t("osmroute")}</a><button type="button" class="k-btn quiet" data-act="hide">${t("hide")}</button></div></div>`;
  K.pop(pan); L.popup().setLatLng([best.lat,best.lon]).setContent(label(best)).openOn(map);
  walkRoute(best,bd); }
function walkRoute(best,bd){ const seq=++routeSeq; if(routeCtl) routeCtl.abort(); routeCtl=new AbortController(); const ctl=routeCtl; const tm=setTimeout(()=>ctl.abort(),9000);
  const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${me[1]},${me[0]};${best.lon},${best.lat}?overview=full&geometries=geojson&steps=false`;
  const done=(m,label,km)=>{ clearTimeout(tm); if(seq!==routeSeq) return; const d=$("dist"); if(!d) return; d.classList.remove("calc"); d.innerHTML=`${fmtDist(m)}<small>${label}</small>`; };
  fetch(url,{signal:ctl.signal,referrerPolicy:"no-referrer"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{ const rt=j&&j.routes&&j.routes[0]; if(!rt||!rt.geometry||!rt.geometry.coordinates) throw 0; if(seq!==routeSeq) return;
    const pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]); if(line) map.removeLayer(line); line=L.polyline(pts,{color:"#2f7bff",weight:5,opacity:.9,lineCap:"round",lineJoin:"round"}).addTo(map); map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:17});
    done(rt.distance,`${t("walk")} · ${Math.max(1,Math.round(rt.duration/60))} ${t("min")}`); }).catch(()=>done(bd,t("air"))); }
function clearLine(){ routeSeq++; if(routeCtl) routeCtl.abort(); if(line&&map){ map.removeLayer(line); line=null; } if(map) map.closePopup(); $("panel").innerHTML=`<span id="hint">${esc(t("hint"))}</span>`; }
$("panel").addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-act=hide]"); if(b){ clearLine(); K.tick(6); } });
function locate(){ const b=$("near"); if(!navigator.geolocation||!map){ K.shake(b); K.toast(t("noGeo")); return; }
  b.disabled=true; const old=b.textContent; b.textContent=t("locating");
  navigator.geolocation.getCurrentPosition(p=>{ b.disabled=false; b.textContent=old; me=[p.coords.latitude,p.coords.longitude]; if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map); nearest(); },
    ()=>{ b.disabled=false; b.textContent=old; K.shake(b); K.toast(t("noGeo")); },{enableHighAccuracy:true,timeout:10000}); }
function tools(){ const el=$("tools"); el.innerHTML=""; const counts={}; data.forEach(p=>{counts[p.c]=(counts[p.c]||0)+1;});
  Object.keys(CLASSES).forEach(k=>{ const b=document.createElement("button"); b.type="button"; b.className="k-chip"; b.setAttribute("aria-pressed",hidden.has(k)?"false":"true");
    b.innerHTML=`<i style="background:${CLASSES[k].color}"></i>${esc(CLASSES[k][lang])} <b>${counts[k]||0}</b>`; b.onclick=()=>{ hidden.has(k)?hidden.delete(k):hidden.add(k); b.setAttribute("aria-pressed",hidden.has(k)?"false":"true"); draw(); }; el.appendChild(b); });
  $("near").textContent=t("near"); }
$("near").addEventListener("click",locate);
function applyLang(){ document.documentElement.lang=lang; document.title=t("title");
  $("h").textContent=t("title"); $("s").textContent=t("sub")||""; $("hint").textContent=t("hint"); $("src").textContent=t("src"); $("foot").textContent=t("foot"); $("routenote").textContent=t("routenote");
  const b=$("banner"); if(BANNER&&t("banner")){ b.hidden=false; b.innerHTML=esc(t("banner").replace("{d}",BANNER.date).replace("{s}",BANNER.status))+` <a href="${BANNER.url}" rel="noopener">naturgefahren.be.ch</a>`; } else b.hidden=true;
  document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===lang?"true":"false")); tools(); draw(); if(map) setTimeout(()=>map.invalidateSize(),50); }
document.querySelectorAll(".lang button").forEach(x=>x.addEventListener("click",()=>{lang=x.dataset.l; try{localStorage.setItem(KEY,lang);}catch(e){} applyLang();}));
applyLang();
})();
</script>
