name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check
        run: |
          grep -q 'name="viewport"' index.html
          grep -q 'window.FOUNTAINS=' fountains.js
          # offline-fähig: Daten liegen im Repo, kein fetch
          ! grep -qiE 'fetch\(|XMLHttpRequest|sendBeacon' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp fountains.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
